version: '3.9'

services:

  # ── Application NestJS ───────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          
    container_name: notification-service
    command: yarn start:dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '8010:8010'
    environment:
      NODE_ENV: development
      PORT: 8010
      API_PREFIX: notification-service/v1
      DATABASE_URL: postgresql://notif_user:notif_password@postgres:5432/notif_db
      REDIS_HOST: al-mizan-redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@al-mizan-rabbitmq:5672
      RABBITMQ_EXCHANGE: al_mizan_events
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - al-mizan-network
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: notif-postgres
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_password
    ports:
      - '5437:5432'      
    volumes:
      - notif_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notif_user -d notif_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - al-mizan-network
    restart: unless-stopped

volumes:
  notif_postgres_data:

networks:
  al-mizan-network:
    name: al-mizan-network
    driver: bridge
    external: true
