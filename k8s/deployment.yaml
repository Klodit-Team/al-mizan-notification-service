apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: al-mizan
  labels:
    app: notification-service
    version: "1.0.0"
    app.kubernetes.io/part-of: al-mizan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        version: "1.0.0"
    spec:
      serviceAccountName: notification-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: notification-service
          image: harbor.almizan.dz/al-mizan/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8010
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /notification-service/v1/health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /notification-service/v1/health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: harbor-registry-secret
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: al-mizan
  labels:
    app: notification-service
