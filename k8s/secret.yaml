# ⚠️ Ne jamais commiter ce fichier avec de vraies valeurs !
# En production : utiliser HashiCorp Vault ou Kubernetes External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: al-mizan
  labels:
    app: notification-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://notif_user:CHANGE_ME@notif-postgres-service:5432/notif_db"
  REDIS_PASSWORD: ""
  SMTP_HOST: "smtp.almizan.dz"
  SMTP_USER: "notifications@almizan.dz"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM_NAME: "Al-Mizan – Marchés Publics"
  SMTP_FROM_EMAIL: "notifications@almizan.dz"
  INFOBIP_API_KEY: "CHANGE_ME"
  INFOBIP_SENDER: "ALMIZAN"
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_FROM_NUMBER: "+213XXXXXXXXX"
  # Firebase : encoder le service-account.json en base64
  # cat firebase-service-account.json | base64 -w 0
  FIREBASE_SERVICE_ACCOUNT_B64: "CHANGE_ME_BASE64_OF_JSON"
